/* ===== HELIOS MOBILE v1 ===== */
@media (max-width: 768px) {

  /* Prevent horizontal scroll */
  html, body, #root {
    overflow-x: hidden !important;
    max-width: 100vw !important;
  }

  * { box-sizing: border-box !important; }

  /* Bottom padding so content isn't behind bottom nav */
  main, [class*="overflow-y-auto"] {
    padding-bottom: 80px !important;
  }

  /* Single column all grids */
  [class*="grid-cols-2"],
  [class*="grid-cols-3"],
  [class*="grid-cols-4"],
  [class*="grid-cols-5"],
  [class*="md\\:grid-cols"],
  [class*="lg\\:grid-cols"] {
    grid-template-columns: 1fr !important;
  }

  /* Cards full width */
  [class*="rounded-xl"], [class*="rounded-2xl"] {
    max-width: 100% !important;
  }

  /* Charts contained */
  .recharts-wrapper {
    max-width: 100% !important;
    overflow: hidden !important;
  }

  /* Tables scroll inside, not page */
  [class*="overflow-x-auto"] {
    max-width: calc(100vw - 16px) !important;
  }

  /* Reduce padding on mobile */
  [class*="p-6"] { padding: 12px !important; }
  [class*="p-8"] { padding: 12px !important; }
  [class*="px-8"] { padding-left: 12px !important; padding-right: 12px !important; }

  /* Bigger touch targets */
  button { min-height: 36px !important; }

  /* Hide desktop sidebar on mobile (it's a drawer, shown via JS) */
  /* Sidebar already handles this with translate-x */

  /* Font size adjustments */
  [class*="text-4xl"] { font-size: 1.5rem !important; }
  [class*="text-3xl"] { font-size: 1.25rem !important; }
}
/* ===== END HELIOS MOBILE ===== */
